<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>Categoría — Nuestros Juegos</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:ital,wght@0,300;0,500;1,400;0,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/global.css?v=3">
<link rel="stylesheet" href="../css/mobile.css?v=4">
<link rel="stylesheet" href="../css/auth-gate.css">
</head>
<body>

<!-- ====== PORTÓN DE ACCESO (usuario + contraseña) ====== -->
<div id="gate-acceso" class="gate-acceso">
    <form class="gate-tarjeta" onsubmit="return false;">
        <div class="gate-candado">🔒</div>
        <h2>Nuestros Juegos</h2>
        <p>Elegí quién sos e ingresá la contraseña</p>
        <div class="gate-usuarios">
            <button type="button" class="gate-btn-usuario" data-usuario="carito" onclick="gateElegirUsuario(this)">Carito 💖</button>
            <button type="button" class="gate-btn-usuario" data-usuario="nico" onclick="gateElegirUsuario(this)">Nico 💙</button>
        </div>
        <input type="password" id="gate-clave" class="gate-input" placeholder="Contraseña" autocomplete="off" inputmode="numeric" onkeydown="gateEntrarConEnter(event)">
        <button type="button" class="gate-btn-entrar" onclick="gateEntrar()">Entrar</button>
        <div id="gate-error" class="gate-error"></div>
    </form>
</div>
<script src="../js/auth-gate.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(function(){});</script>
<script src="../js/icon-sprite.js?v=11"></script>

<div class="contenedor" id="pagina-categoria">
    <div class="encabezado">
        <a href="../juegos.html" class="btn-volver"><svg class="icono-svg"><use href="#icono-flecha-izq"></use></svg> Juegos</a>
    </div>
    <div class="titulo-app" id="titulo-categoria"></div>
    <div class="subtitulo-app" id="subtitulo-categoria"></div>
    <div class="otras-categorias" id="otras-categorias"></div>
    <input type="text" id="buscador-categoria" class="input-buscador" placeholder="🔍 Filtrar por nombre..." autocomplete="off" oninput="filtrarCategoria()">
    <div class="controles-categoria">
        <div class="filtros-rapidos" id="filtros-categoria"></div>
        <label class="orden-categoria">Orden <select id="orden-categoria" onchange="filtrarCategoria()">
            <option value="">Sugerido</option><option value="nombre">A–Z</option><option value="recientes">Últimos que jugaron</option><option value="nunca">Nunca jugados primero</option>
        </select></label>
    </div>
    <div class="lista-juegos-categoria" id="lista-juegos-categoria"></div>
</div>

<script src="../js/juegos-data.js?v=43"></script>
<script src="../js/filtro-categoria.js?v=2"></script>
</body>
</html>
